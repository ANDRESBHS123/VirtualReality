<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-box class="body" wireframe="true" position="2 1 0" width="4" height="4" depth="4">
        <a-sphere color="yellow" side="double" rotation="90 0 0" phi-start="0" phi-length="180"></a-sphere>
        <a-sphere color="yellow" side="double" position="0 0.5 0" rotation="90 0 0" phi-start="0" phi-length="180"></a-sphere>
      </a-box>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
