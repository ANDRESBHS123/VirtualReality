<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Task 1: Using the color attribute make the following tree look better -->
      <a-sphere src="texture_snow.jpeg" side="double" color="#FFFFFF" position="0 4 -5" radius="1.25"></a-sphere>
      <a-sphere src="texture_snow.jpeg" side="double" color="#FFFFFF" position="-1 3 -5" radius="1.25"></a-sphere>
      <a-sphere src="texture_snow.jpeg" side="double" color="#FFFFFF" position="1 3 -5" radius="1.25"></a-sphere>
      <a-cylinder position="0 0.75 -5" radius="0.5" height="3.5" color="#654321"></a-cylinder>

     <!-- Task 2: Using one of the texture images make the plane look like the ground.  Don't forget to repeat the image if it looks blurred. -->
      <a-plane src="texture_snow.jpeg" repeat="10 10" position="0 0 -4" rotation="-90 0 0" width="50" height="50"></a-plane>
      <a-sky src="bk1.jpeg"></a-sky>
      <!-- Task 3: Using either the sky or bk images, change the sky component -->
      
    </a-scene>
  </body>
</html>
