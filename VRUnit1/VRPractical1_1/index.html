<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
    <a-box class="car" wireframe="true" position="2 -1.5 1.4" width="2" height="4" depth="4" rotation="180 90 0">
     <!-- Front -->
      <a-box width="1" height="2.7" depth="0.5" rotation="0 0 90" position="-2 0 0.3" color="yellow"></a-box>
      
      <!-- Sides -->
      <a-box width="1" height="3.1" depth="0.2" rotation="0 90 90" position="-3.3 0 -1" color="yellow"></a-box>
      <a-box width="1" height="2.5" depth="0.2" rotation="0 -90 90" position="-0.6 0 -0.7" color="yellow"></a-box>
    
      <a-box width="1" height="2.7" depth="0.2" rotation="0 90 90" position="-3.3 0 -3.2" color="yellow"></a-box>
      <a-box width="1" height="2.7" depth="0.2" rotation="0 -90 90" position="-0.6 0 -3.2" color="yellow"></a-box>
      <a-box width="1" height="2.7" depth="0.2" rotation="0 180 90" position="-1.9 0 -4.5" color="yellow"></a-box>
      
      <!-- The Hood -->
      <a-box width="2.5" height="2.7" depth="0.1" rotation="90 180 90" position="-2 0.5 -0.7" color="yellow"></a-box>

      <!-- The Body -->
      <a-box width="2.5" height="2.2" depth="0.1" rotation="190 180 180" position="-2 1 -2" color="yellow"></a-box>
      <a-box width="2.5" height="2.2" depth="0.1" rotation="90 180 180" position="-2 2 -3.2" color="yellow"></a-box>
      
      <a-box width="2.5" height="2" depth="0.1" rotation="0 90 180" position="-3.2 1.2 -3.4" color="yellow"></a-box>
      <a-box width="2.5" height="2" depth="0.1" rotation="0 90 180" position="-1 1.2 -3.4" color="yellow"></a-box>
      <a-box width="2.5" height="2" depth="0.1" rotation="0 180 180" position="-2 1.2 -4.5" color="yellow"></a-box>
      
      <!-- Wheels -->
      <a-torus width="2.5" height="2" depth="0.1" rotation="0 90 180" position="-1 -1.5 -3.4" color="black"></a-sphere>
      <a-torus width="2.5" height="2" depth="0.1" rotation="0 180 180" position="0.3 0 -2" color="black"></a-box>

      <!-- <a-torus width="2.5" height="2" depth="0.1" rotation="0 90 180" position="1 -0.4 -1" color="black"></a-sphere> -->
      <a-torus width="2.5" height="2" depth="0.1" rotation="0 180 180" position="2.7 0 3.3" color="black"></a-box> -->
      
      <!-- Headlights  -->
      <a-cylinder width="2.5" height="0.5" radius="0.3" depth="0" position="-1.5 1.5 1" rotation="180 180 270" color="orange"></a-cylinder>
      <a-cylinder width="2.5" height="0.5" radius="0.3" depth="0" position="-1.5 1.5 -1.2" rotation="180 180 270" color="orange"></a-cylinder>

     <!-- Back Lights -->
      <a-cylinder width="2.5" height="0.5" radius="0.3" depth="0" position="4.2 1.5 1" rotation="180 180 270" color="red"></a-cylinder>
      <a-cylinder width="2.5" height="0.5" radius="0.3" depth="0" position="4.2 1.5 -1.2" rotation="180 180 270" color="red"></a-cylinder>

    <!-- Windows -->
      <a-box width="2.5" height="1.5" depth="0" position="2.6 2.4 1.5" color="cyan"></a-box>
      <a-box width="2.5" height="1.5" depth="0" rotation="0 90" position="4 2.4 0" color="cyan"></a-box>
      <a-box width="2.5" height="1.5" depth="0" rotation="0 180" position="2.8 2.4 -1.6" color="cyan"></a-box>
    </a-box>
      
      
    
    
    
      <a-plane position="0 -3 -4" rotation="-90 2 0" width="40" height="40" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
